name: Windows candidate

# Builds the Windows NSIS installer on a GitHub-hosted runner, records its
# signature state and SHA-256, and optionally submits it to SignPath for
# Authenticode signing.
#
# The sign job stays skipped until the repository has these values:
#   vars.SIGNPATH_ORGANIZATION_ID
#   vars.SIGNPATH_PROJECT_SLUG
#   vars.SIGNPATH_SIGNING_POLICY_SLUG
#   vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG   (optional, defaults to SignPath default)
#   secrets.SIGNPATH_API_TOKEN

on:
  workflow_dispatch:
  push:
    branches: [codex/c-standard-library]
    paths:
      - .github/workflows/windows-candidate.yml
      - desktop/**
      - web/**

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # The static builder prints Chinese status lines; without UTF-8 the
      # runner's cp1252 console fails with "charmap codec can't encode".
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the static site into desktop/site
        run: |
          python scripts/build_static.py --output desktop/site
          python scripts/build_static.py --verify desktop/site

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build the NSIS installer (unsigned)
        working-directory: desktop
        run: npm run dist

      - name: Record version, signature state and checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem artifacts/desktop-release -Filter 'CodeLens-Setup-*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'installer not found' }
          $version = (Get-Item $exe.FullName).VersionInfo
          "file=$($exe.Name) bytes=$($exe.Length) fileVersion=$($version.FileVersion) productVersion=$($version.ProductVersion)"
          $sig = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          "signature=$($sig.Status) signer=$($sig.SignerCertificate.Subject)"
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash
          "sha256=$hash"
          "$hash  $($exe.Name)" | Set-Content -LiteralPath 'artifacts/desktop-release/SHA256.txt' -Encoding utf8NoBOM
          # Keep the summary readable for whoever approves the SignPath request.
          $summary = $env:GITHUB_STEP_SUMMARY
          "### Windows candidate" | Add-Content -LiteralPath $summary
          "" | Add-Content -LiteralPath $summary
          "- file: $($exe.Name)" | Add-Content -LiteralPath $summary
          "- bytes: $($exe.Length)" | Add-Content -LiteralPath $summary
          "- fileVersion / productVersion: $($version.FileVersion) / $($version.ProductVersion)" | Add-Content -LiteralPath $summary
          "- signature: $($sig.Status)" | Add-Content -LiteralPath $summary
          "- sha256: $hash" | Add-Content -LiteralPath $summary

      - name: Upload the unsigned artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          # SignPath signs a ZIP whose root must contain only the installer;
          # the checksum stays in the job summary instead of the archive.
          name: CodeLens-Windows-unsigned
          path: artifacts/desktop-release/CodeLens-Setup-*.exe

  sign:
    needs: build
    if: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Submit the installer to SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Verify the signed installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem signed -Filter '*.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'signed installer not found' }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          "signature=$($sig.Status) signer=$($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "signature is $($sig.Status)" }
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash
          "sha256=$hash"
          "$hash  $($exe.Name)" | Set-Content -LiteralPath 'signed/SHA256.txt' -Encoding utf8NoBOM

      - uses: actions/upload-artifact@v4
        with:
          name: CodeLens-Windows-signed
          path: |
            signed/**/*.exe
            signed/SHA256.txt
